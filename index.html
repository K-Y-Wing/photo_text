<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>写真に文字を入れる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Klee+One:wght@600&family=Noto+Sans+JP:wght@700&display=swap">
<style>
/* Layout: one narrow column, preview on top, numbered steps below — big tap targets for seniors */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --fg:#1C2530; --muted:#55606D;
  --accent:#2A5DB0; --accent-ink:#FFFFFF; --accent-soft:#E3ECFA;
  --line:#D3DAE3; --ok:#2B7A4B; --warn:#9A5800;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171D; --surface:#1B222B; --fg:#E8EDF2; --muted:#A6B1BD;
  --accent:#86ADF0; --accent-ink:#0E1522; --accent-soft:#22324A;
  --line:#2F3946; --ok:#6CC892; --warn:#E3A857; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12171D; --surface:#1B222B; --fg:#E8EDF2; --muted:#A6B1BD;
  --accent:#86ADF0; --accent-ink:#0E1522; --accent-soft:#22324A;
  --line:#2F3946; --ok:#6CC892; --warn:#E3A857; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:18px;line-height:1.7;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.6rem;font-weight:700;margin:0;line-height:1.35;text-wrap:balance}
.lead{margin:4px 0 0;color:var(--muted)}
.safe{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;font-size:.95rem}
.safe svg{flex:none;margin-top:4px;color:var(--ok)}

.preview{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
#view{display:block;width:100%;height:auto;border-radius:8px;max-width:100%}
.tag{position:absolute;top:18px;left:18px;margin:0;background:rgba(0,0,0,.6);color:#fff;font-size:.85rem;padding:2px 10px;border-radius:999px}

.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.step h2{font-size:1.2rem;margin:0;display:flex;align-items:center;gap:10px}
.num{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:1rem;flex:none}

.btn{font:inherit;font-weight:700;min-height:58px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);padding:8px 16px;cursor:pointer;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

textarea{font:inherit;font-size:1.25rem;width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical;line-height:1.5}
.hint{margin:-4px 0 0;font-size:.9rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:1rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px}

.field{display:flex;flex-direction:column;gap:8px}
.label{margin:0;font-weight:700}
.opts{display:grid;gap:8px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{font:inherit;font-size:1rem;min-height:52px;border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;cursor:pointer;padding:6px 4px;line-height:1.3}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}

.posgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;aspect-ratio:4/3;width:100%;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px}
.posgrid .opt{min-height:0;font-size:.9rem;border-width:1px;background:var(--surface)}
.posgrid .opt[aria-pressed="true"]{border-width:2px}

.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:360px}
.sw{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:3px}
.sw:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.f-gothic{font-family:"Noto Sans JP","Hiragino Sans",sans-serif;font-weight:700}
.f-maru{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;font-weight:700}
.f-tegaki{font-family:"Klee One","Hiragino Mincho ProN",serif;font-weight:600}

.note{margin:0;padding:10px 12px;border-radius:10px;font-size:.95rem;background:var(--bg)}
.note.ok{color:var(--ok)}
.note.warn{color:var(--warn)}
#outImg{display:block;width:100%;border-radius:8px;margin-top:8px;-webkit-touch-callout:default}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>

<main class="wrap">
  <header>
    <h1>写真に文字を入れる</h1>
    <p class="lead">好きな言葉を写真に書き込み、新しい写真として保存します。元の写真はそのまま残ります。</p>
  </header>

  <p class="safe">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <span>写真はこのスマホの中だけで処理されます。AIやインターネットには送られません。</span>
  </p>

  <section class="preview" aria-label="できあがりの見本">
    <canvas id="view" width="1200" height="900"></canvas>
    <p id="sampleTag" class="tag">見本の写真です</p>
  </section>

  <section class="step">
    <h2><span class="num">1</span>写真を選ぶ</h2>
    <button id="pick" class="btn primary" type="button">写真を選ぶ</button>
    <input id="file" type="file" accept="image/*" hidden>
    <p id="loadMsg" class="note" hidden></p>
  </section>

  <section class="step">
    <h2><span class="num">2</span>文字を書く</h2>
    <textarea id="text" rows="2" aria-label="写真に入れる文字">旅の思い出</textarea>
    <p class="hint">改行すると2行になります（3行まで）。下の言葉をタップしても入ります。</p>
    <div class="chips" id="chips">
      <button class="chip" type="button">おめでとう</button>
      <button class="chip" type="button">お誕生日おめでとう</button>
      <button class="chip" type="button">ありがとう</button>
      <button class="chip" type="button">旅の思い出</button>
      <button class="chip" type="button">また会おうね</button>
      <button class="chip" type="button">元気にしています</button>
    </div>
  </section>

  <section class="step">
    <h2><span class="num">3</span>見た目を選ぶ</h2>

    <div class="field">
      <p class="label">場所</p>
      <div class="posgrid" data-group="pos" role="group" aria-label="文字の場所">
        <button class="opt" type="button" data-v="0">左上</button>
        <button class="opt" type="button" data-v="1">上</button>
        <button class="opt" type="button" data-v="2">右上</button>
        <button class="opt" type="button" data-v="3">左</button>
        <button class="opt" type="button" data-v="4">まん中</button>
        <button class="opt" type="button" data-v="5">右</button>
        <button class="opt" type="button" data-v="6">左下</button>
        <button class="opt" type="button" data-v="7">下</button>
        <button class="opt" type="button" data-v="8">右下</button>
      </div>
    </div>

    <div class="field">
      <p class="label">色</p>
      <div class="swatches" data-group="color" role="group" aria-label="文字の色">
        <button class="sw" type="button" data-v="white"  style="background:#FFFFFF" aria-label="白"></button>
        <button class="sw" type="button" data-v="yellow" style="background:#FFD43B" aria-label="黄色"></button>
        <button class="sw" type="button" data-v="pink"   style="background:#FF8FB8" aria-label="ピンク"></button>
        <button class="sw" type="button" data-v="red"    style="background:#E0262D" aria-label="赤"></button>
        <button class="sw" type="button" data-v="blue"   style="background:#1F5FBF" aria-label="青"></button>
        <button class="sw" type="button" data-v="black"  style="background:#1A1A1A" aria-label="黒"></button>
      </div>
    </div>

    <div class="field">
      <p class="label">大きさ</p>
      <div class="opts three" data-group="size" role="group" aria-label="文字の大きさ">
        <button class="opt" type="button" data-v="s">小</button>
        <button class="opt" type="button" data-v="m">中</button>
        <button class="opt" type="button" data-v="l">大</button>
      </div>
    </div>

    <div class="field">
      <p class="label">書体</p>
      <div class="opts three" data-group="font" role="group" aria-label="書体">
        <button class="opt f-gothic" type="button" data-v="gothic">くっきり</button>
        <button class="opt f-maru" type="button" data-v="maru">やわらか</button>
        <button class="opt f-tegaki" type="button" data-v="tegaki">手書き風</button>
      </div>
    </div>

    <div class="field">
      <p class="label">見やすくする工夫</p>
      <div class="opts two" data-group="style" role="group" aria-label="見やすくする工夫">
        <button class="opt" type="button" data-v="outline">文字にふちどり</button>
        <button class="opt" type="button" data-v="band">文字の後ろに帯</button>
      </div>
    </div>
  </section>

  <section class="step">
    <h2><span class="num">4</span>保存する</h2>
    <button id="save" class="btn primary" type="button">文字入りの写真を保存</button>
    <p id="saveMsg" class="note" hidden></p>
    <div id="longpress" hidden>
      <p class="note">下の写真を<b>長押し</b>して、「写真に保存」または「画像をダウンロード」を選んでください。</p>
      <img id="outImg" alt="文字が入った写真">
    </div>
  </section>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var state = { pos:"7", color:"white", size:"m", font:"maru", style:"outline" };

  var COLORS = {
    white:{fill:"#FFFFFF",light:true}, yellow:{fill:"#FFD43B",light:true}, pink:{fill:"#FF8FB8",light:true},
    red:{fill:"#E0262D",light:false}, blue:{fill:"#1F5FBF",light:false}, black:{fill:"#1A1A1A",light:false}
  };
  var SIZES = { s:0.055, m:0.08, l:0.115 };
  var FONTS = {
    gothic:{w:700, fam:'"Noto Sans JP","Hiragino Sans",sans-serif'},
    maru:{w:700, fam:'"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif'},
    tegaki:{w:600, fam:'"Klee One","Hiragino Mincho ProN",serif'}
  };

  /* ---------- 見本の写真（人が写っていない風景） ---------- */
  function makeSample(){
    var c = document.createElement("canvas"); c.width = 1200; c.height = 900;
    var x = c.getContext("2d");
    var g = x.createLinearGradient(0,0,0,560);
    g.addColorStop(0,"#5E8FD6"); g.addColorStop(1,"#F6C98B");
    x.fillStyle = g; x.fillRect(0,0,1200,560);
    x.fillStyle = "#FFE7A8"; x.beginPath(); x.arc(860,400,70,0,Math.PI*2); x.fill();
    x.fillStyle = "#6E7FA3"; x.beginPath(); x.moveTo(0,560); x.lineTo(220,330); x.lineTo(420,520); x.lineTo(640,300); x.lineTo(900,540); x.lineTo(1200,380); x.lineTo(1200,560); x.closePath(); x.fill();
    x.fillStyle = "#3F5E4E"; x.beginPath(); x.moveTo(0,560); x.lineTo(160,470); x.lineTo(380,560); x.lineTo(700,450); x.lineTo(1000,560); x.lineTo(1200,500); x.lineTo(1200,560); x.closePath(); x.fill();
    var w = x.createLinearGradient(0,560,0,900);
    w.addColorStop(0,"#7FA6C9"); w.addColorStop(1,"#2F4D6B");
    x.fillStyle = w; x.fillRect(0,560,1200,340);
    x.fillStyle = "rgba(255,231,168,.55)";
    for(var i=0;i<9;i++){ x.fillRect(860-60+i*6, 590+i*30, 120-i*12, 6); }
    return c;
  }

  var src = makeSample(), isSample = true, baseName = "photo";

  /* ---------- 文字を描く ---------- */
  function getLines(){
    var t = $("text").value.replace(/\r/g,"").split("\n");
    while(t.length && !t[t.length-1].trim()) t.pop();
    return t.slice(0,3);
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }

  function drawScene(ctx, W, H){
    ctx.drawImage(src, 0, 0, W, H);
    var lines = getLines();
    if(!lines.join("").trim()) return;

    var base = Math.min(W,H), margin = base*0.05;
    var f = FONTS[state.font], col = COLORS[state.color];
    var size = base*SIZES[state.size];
    var band = state.style === "band";
    var pad = band ? size*0.45 : 0;
    var setFont = function(){ ctx.font = f.w + " " + size + "px " + f.fam; };
    setFont();

    var maxW = W - margin*2 - pad*2, widest = 0;
    lines.forEach(function(l){ widest = Math.max(widest, ctx.measureText(l).width); });
    if(widest > maxW){ size *= maxW/widest; pad = band ? size*0.45 : 0; setFont(); widest = maxW; }

    var lineH = size*1.3, blockH = lineH*(lines.length-1) + size;
    var p = +state.pos, c = p % 3, r = Math.floor(p/3);
    var align = ["left","center","right"][c];
    var x = c===0 ? margin+pad : c===1 ? W/2 : W-margin-pad;
    var top = r===0 ? margin+pad : r===1 ? (H-blockH)/2 : H-margin-pad-blockH;

    ctx.save();
    ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.lineJoin = "round";

    if(band){
      var bx = c===0 ? x-pad : c===1 ? x-widest/2-pad : x-widest-pad;
      ctx.fillStyle = col.light ? "rgba(0,0,0,.5)" : "rgba(255,255,255,.8)";
      roundRect(ctx, bx, top-pad, widest+pad*2, blockH+pad*2, size*0.3);
      ctx.fill();
    }

    lines.forEach(function(l,i){
      var y = top + i*lineH + size/2;
      if(!band){
        ctx.lineWidth = size*0.16;
        ctx.strokeStyle = col.light ? "rgba(0,0,0,.6)" : "rgba(255,255,255,.92)";
        ctx.shadowColor = col.light ? "rgba(0,0,0,.45)" : "rgba(255,255,255,.4)";
        ctx.shadowBlur = size*0.25;
        ctx.strokeText(l, x, y);
        ctx.shadowBlur = 0;
      }
      ctx.fillStyle = col.fill;
      ctx.fillText(l, x, y);
    });
    ctx.restore();
  }

  /* ---------- 見本の表示 ---------- */
  var view = $("view");
  function render(){
    var w = src.width, h = src.height, k = Math.min(1, 1400/Math.max(w,h));
    view.width = Math.round(w*k); view.height = Math.round(h*k);
    drawScene(view.getContext("2d"), view.width, view.height);
    $("longpress").hidden = true; $("saveMsg").hidden = true;
  }
  function renderWithFont(){
    render();
    if(document.fonts && document.fonts.load){
      var f = FONTS[state.font];
      document.fonts.load(f.w + " 48px " + f.fam, $("text").value || "あ").then(render, function(){});
    }
  }

  /* ---------- 選択ボタン ---------- */
  function syncGroup(group){
    var box = document.querySelector('[data-group="'+group+'"]');
    Array.prototype.forEach.call(box.querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", b.dataset.v === state[group] ? "true" : "false");
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-group]"), function(box){
    var group = box.dataset.group;
    box.addEventListener("click", function(e){
      var b = e.target.closest("button"); if(!b) return;
      state[group] = b.dataset.v; syncGroup(group); renderWithFont();
    });
    syncGroup(group);
  });

  $("text").addEventListener("input", renderWithFont);
  $("chips").addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if(!b) return;
    $("text").value = b.textContent; renderWithFont();
  });

  /* ---------- 写真の読み込み ---------- */
  var file = $("file");
  $("pick").addEventListener("click", function(){ file.value = ""; file.click(); });
  file.addEventListener("change", function(){
    var f = file.files && file.files[0]; if(!f) return;
    var msg = $("loadMsg");
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function(){
      src = im; isSample = false;
      baseName = (f.name || "photo").replace(/\.[^.]+$/,"") || "photo";
      $("sampleTag").hidden = true;
      $("pick").textContent = "別の写真を選ぶ";
      msg.hidden = false; msg.className = "note ok";
      msg.textContent = "写真を読み込みました。上の見本で仕上がりを確かめてください。";
      renderWithFont();
    };
    im.onerror = function(){
      URL.revokeObjectURL(url);
      msg.hidden = false; msg.className = "note warn";
      msg.textContent = "この写真は読み込めませんでした。別の写真を選んでください。";
    };
    im.src = url;
  });

  /* ---------- 保存 ---------- */
  var dlReady = (window.claude && window.claude.use)
    ? window.claude.use("downloads").catch(function(){ return null; })
    : Promise.resolve(null);

  function showLongPress(blob){
    $("outImg").src = URL.createObjectURL(blob);
    $("longpress").hidden = false;
  }
  function note(cls, text){
    var m = $("saveMsg"); m.hidden = false; m.className = "note " + cls; m.textContent = text;
  }

  $("save").addEventListener("click", function(){
    var w = src.width, h = src.height, k = Math.min(1, Math.sqrt(16000000/(w*h)));
    var c = document.createElement("canvas");
    c.width = Math.round(w*k); c.height = Math.round(h*k);
    drawScene(c.getContext("2d"), c.width, c.height);
    c.toBlob(function(blob){
      if(!blob){ note("warn","保存用の写真を作れませんでした。もう一度お試しください。"); return; }
      var name = (isSample ? "見本" : baseName) + "_文字入り.jpg";
      dlReady.then(function(dl){
        if(!dl){ showLongPress(blob); return; }
        dl.save({filename:name, data:blob}).then(function(){
          note("ok","保存しました。写真アプリか「ファイル」アプリに入っています。");
        }, function(err){
          if(err && err.code === "declined"){ note("warn","保存をやめました。もう一度「保存」を押すとやり直せます。"); }
          else if(err && err.code === "rate_limited"){ note("warn","少し待ってから、もう一度押してください。"); }
          else { showLongPress(blob); }
        });
      });
    }, "image/jpeg", 0.92);
  });

  renderWithFont();
})();
</script>

</body></html>
